name: deploy

on:
  push:
    branches: [main]

# one deploy at a time; a newer push supersedes an in-flight run.
# the server-side deploy.sh is convergent, so cancelling mid-run is safe.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # ghcr push with GITHUB_TOKEN
  id-token: write # depot oidc exchange, no DEPOT_TOKEN secret

jobs:
  build:
    name: build and push image
    # forks: depot rejects their oidc claim and ghcr denies the push; skip the noise
    if: github.repository == 'syrianzone/syrianzone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/syrianzone/syrianzone:${{ github.sha }}
            ghcr.io/syrianzone/syrianzone:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            SKEW=${{ github.sha }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
            VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: deploy to vps
    needs: build # the sha tag is pullable before this starts
    runs-on: ubuntu-latest
    steps:
      - name: run remote deploy script
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 10m
          script: /opt/syrianzone/deploy.sh ${{ github.sha }}
