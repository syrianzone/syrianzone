name: Production Deployment

on:
  push:
    branches:
      - main # Trigger deployment on pushes to the main branch

jobs:
  deploy:
    name: Deploy Laravel + Inertia.js Monolith
    runs-on: self-hosted # Execute on your self-hosted GitHub runner
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify PHP Installation
        run: php -v

      - name: Verify Node.js & NPM Installation
        run: node -v && npm -v

      - name: Execute Monolithic Deploy Script
        # Adjust the target path (/var/www/syrianzone) below to match your production web server root directory!
        run: |
          chmod +x deploy.sh
          ./deploy.sh /var/www/syrianzone
