name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deploy at a time; a newer push supersedes an in-flight run.
# the server-side deploy.sh is convergent, so cancelling mid-run is safe.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: run PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: prepare test environment
        run: cp .env.example .env

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: build frontend assets
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: run test suite
        run: php artisan test

  build:
    name: build and push image
    needs: tests
    # forks: ghcr denies the push and the gha cache is theirs anyway; skip the noise
    if: github.repository == 'syrianzone/syrianzone'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr push with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: log in to ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/syrianzone/syrianzone:${{ github.sha }}
            ghcr.io/syrianzone/syrianzone:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
            VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: deploy to vps
    needs: build # the sha tag is pullable before this starts
    runs-on: ubuntu-latest
    steps:
      - name: run remote deploy script
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          X_TIERLIST_ENABLED: ${{ vars.X_TIERLIST_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_EXPECTED_USER_ID: ${{ vars.X_EXPECTED_USER_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 10m
          envs: X_TIERLIST_ENABLED,X_API_KEY,X_API_SECRET,X_ACCESS_TOKEN,X_ACCESS_TOKEN_SECRET,X_EXPECTED_USER_ID
          # Upsert runtime secrets, then run the convergent deploy. Values stay
          # outside the repo. The new sha recreates the container so config cache
          # receives the latest environment.
          script: |
            set -e
            umask 077
            envfile=/opt/syrianzone/.env
            touch "$envfile"
            chmod 600 "$envfile"

            tmpfile=$(mktemp "${envfile}.tmp.XXXXXX")
            trap 'rm -f "$tmpfile"' EXIT
            grep -Ev '^(X_TIERLIST_ENABLED|X_API_KEY|X_API_SECRET|X_ACCESS_TOKEN|X_ACCESS_TOKEN_SECRET|X_EXPECTED_USER_ID)=' "$envfile" > "$tmpfile" || true

            requested_x_enabled=${X_TIERLIST_ENABLED:-false}
            x_enabled=false
            if [ "$requested_x_enabled" = 'true' ]; then
              x_configuration_complete=true
              for value in "$X_API_KEY" "$X_API_SECRET" "$X_ACCESS_TOKEN" "$X_ACCESS_TOKEN_SECRET" "$X_EXPECTED_USER_ID"; do
                if [ -z "$value" ]; then
                  x_configuration_complete=false
                fi
              done

              if [ "$x_configuration_complete" = 'true' ]; then
                x_enabled=true
              else
                echo 'X automation was forced off because its configuration is incomplete' >&2
              fi
            elif [ "$requested_x_enabled" != 'false' ]; then
              echo 'X automation was forced off because its enable value is invalid' >&2
            fi

            printf '%s=%s\n' X_TIERLIST_ENABLED "$x_enabled" >> "$tmpfile"
            printf '%s=%s\n' X_API_KEY "$X_API_KEY" >> "$tmpfile"
            printf '%s=%s\n' X_API_SECRET "$X_API_SECRET" >> "$tmpfile"
            printf '%s=%s\n' X_ACCESS_TOKEN "$X_ACCESS_TOKEN" >> "$tmpfile"
            printf '%s=%s\n' X_ACCESS_TOKEN_SECRET "$X_ACCESS_TOKEN_SECRET" >> "$tmpfile"
            printf '%s=%s\n' X_EXPECTED_USER_ID "$X_EXPECTED_USER_ID" >> "$tmpfile"
            chown root:root "$tmpfile"
            chmod 600 "$tmpfile"
            mv "$tmpfile" "$envfile"
            chmod 600 "$envfile"
            /opt/syrianzone/deploy.sh ${{ github.sha }}
