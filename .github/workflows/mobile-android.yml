name: mobile android release

# Builds a signed APK + AAB of the Flutter app in mobile-2.0/.
#   - push a tag like `mobile-v1.2.0` → build, attach to a GitHub release,
#     and upload the AAB to the Play "internal" track (if PLAY_SERVICE_ACCOUNT_JSON is set).
#   - run manually (Actions → "mobile android release" → Run workflow) to pick a track
#     or just build artifacts without uploading.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (e.g. "upload")
#   ANDROID_KEY_PASSWORD       key password
# Optional:
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play service-account JSON key (enables Play upload)

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload the AAB to
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none

concurrency:
  group: mobile-android-release
  cancel-in-progress: false

permissions:
  contents: write # attach builds to the GitHub release on tag pushes

defaults:
  run:
    # explicit bash → GitHub runs it with `-eo pipefail`, so a failing command
    # in a pipeline (e.g. apksigner | tee) fails the step.
    shell: bash
    working-directory: mobile-2.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_TRACK: ${{ github.event_name == 'push' && 'internal' || inputs.track }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: install dependencies
        run: flutter pub get

      # Passwords and alias go to Gradle as env vars (read verbatim by
      # build.gradle.kts), not via key.properties, whose parser would mangle
      # backslashes and leading spaces.
      - name: set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to build a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      # versionName comes from pubspec.yaml (`version: X.Y.Z+N`); versionCode must
      # strictly increase for every Play upload, so use the workflow run number.
      - name: compute version
        id: version
        run: |
          name=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          code=$((1000 + GITHUB_RUN_NUMBER))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $name ($code)"

      - name: build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}

      - name: build AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}

      - name: verify release signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK is debug-signed"; exit 1
          fi

      - name: rename outputs
        run: |
          mkdir -p dist
          v="${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/syrianzone-$v.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/syrianzone-$v.aab"
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            cp build/app/outputs/mapping/release/mapping.txt dist/mapping.txt
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syrianzone-android-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: mobile-2.0/dist/
          retention-days: 30

      - name: attach to GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Android $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/*.aab --clobber

      - name: check Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "$PLAY_TRACK" != "none" ] && [ -n "$PLAY_JSON" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping Play upload (track=$PLAY_TRACK, credentials present: $([ -n "$PLAY_JSON" ] && echo yes || echo no))"
          fi

      - name: upload to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: syrian.zone
          releaseFiles: mobile-2.0/dist/*.aab
          track: ${{ env.PLAY_TRACK }}
          # "draft" is required while the app has never been published on Play;
          # switch to "completed" once the first release is live.
          status: draft
