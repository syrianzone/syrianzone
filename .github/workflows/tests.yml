name: tests

# The gate both deploy workflows run before they ship: one reusable workflow so
# production and staging are checked by the same commands (scripts/gate.sh).
on:
  workflow_call:
    inputs:
      ref:
        description: commit, branch or tag to check; defaults to the caller's commit
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  gate:
    name: run the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: prepare test environment
        run: cp .env.example .env

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: build frontend assets
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: run the gate
        run: bash scripts/gate.sh
