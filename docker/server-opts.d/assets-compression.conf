# Serve pre-compressed Brotli (level 11) and Gzip (level 9) Vite assets with zero runtime CPU.
# Built during Docker Stage 1 by scripts/precompress-assets.mjs.
# Works behind Cloudflare (which forwards & caches `br`) and direct-to-origin.
location ~* ^/build/assets/(.+\.(js|css|svg))$ {
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    set $br_candidate "";
    if ($http_accept_encoding ~* "\bbr\b") {
        set $br_candidate "Y";
    }
    if (-f $request_filename.br) {
        set $br_candidate "${br_candidate}Y";
    }
    if ($br_candidate = "YY") {
        rewrite ^/build/assets/(.+\.js)$ /__br_js/$1 last;
        rewrite ^/build/assets/(.+\.css)$ /__br_css/$1 last;
        rewrite ^/build/assets/(.+\.svg)$ /__br_svg/$1 last;
    }

    try_files $uri =404;
}

location ~ ^/__br_js/(.+)$ {
    internal;
    gzip off;
    default_type application/javascript;
    add_header Content-Encoding br always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Vary "Accept-Encoding" always;
    alias /var/www/html/public/build/assets/$1.br;
}

location ~ ^/__br_css/(.+)$ {
    internal;
    gzip off;
    default_type text/css;
    add_header Content-Encoding br always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Vary "Accept-Encoding" always;
    alias /var/www/html/public/build/assets/$1.br;
}

location ~ ^/__br_svg/(.+)$ {
    internal;
    gzip off;
    default_type image/svg+xml;
    add_header Content-Encoding br always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Vary "Accept-Encoding" always;
    alias /var/www/html/public/build/assets/$1.br;
}
