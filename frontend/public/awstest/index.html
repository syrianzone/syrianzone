<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Region Connectivity & Status</title>
    <style>
        :root {
            --primary: #232f3e;
            --secondary: #ff9900;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333;
            --border: #e1e4e8;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --highlight: #e0f2fe;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: var(--primary);
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
            margin-top: 8px;
        }

        /* Hero Section for User's Region */
        .hero-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border-left: 6px solid var(--secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .hero-region-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .hero-status {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 50px;
            background: #eee;
            color: #777;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .hero-status.success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .hero-status.error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .hero-latency {
            margin-top: 10px;
            font-family: monospace;
            font-size: 1.1rem;
            color: #555;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #ec8c00;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Table Styles */
        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f3f5;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #555;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #fafafa;
        }

        /* Status Badges */
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }

        .badge.pending {
            background: #eee;
            color: #777;
        }

        .badge.success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .badge.error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .highlight-row {
            background-color: var(--highlight) !important;
        }

        .region-code {
            font-family: monospace;
            color: #666;
            font-size: 0.85rem;
            background: #eee;
            padding: 2px 4px;
            border-radius: 4px;
            margin-left: 5px;
        }

        @media (max-width: 600px) {
            .hero-card {
                padding: 15px;
            }

            .hero-region-name {
                font-size: 1.4rem;
            }

            th,
            td {
                padding: 10px;
            }

            .hide-mobile {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>AWS Region Status</h1>
            <div class="subtitle">Checking connectivity from your location to AWS Datacenters</div>
        </header>

        <!-- Hero Card: Auto-detected User Region -->
        <div id="heroSection" class="hero-card" style="display:none;">
            <div class="hero-title">Detected User Region</div>
            <div class="hero-region-name" id="heroName">Detecting...</div>
            <div class="hero-status" id="heroStatus">
                <span>•</span> <span id="heroStatusText">Waiting to test...</span>
            </div>
            <div class="hero-latency" id="heroLatency">-- ms</div>
            <div style="margin-top:10px; font-size: 0.8rem; color:#888;">
                (Based on your timezone: <span id="detectedTimezone">--</span>)
            </div>
        </div>

        <div class="controls">
            <h3 style="margin:0; color:#444;">All Regions</h3>
            <button id="runBtn" onclick="runAllTests()">Run Connectivity Test</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Region Name</th>
                        <th>Status</th>
                        <th>Latency</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <!-- Rows injected by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        /**
         * AWS Regions Data
         * We use a comprehensive list to ensure we catch the user's region.
         * The 'endpoint' is the S3 service, which is reliable for pinging.
         */
        const awsRegions = [
            { code: "us-east-1", name: "US East (N. Virginia)", endpoint: "https://s3.us-east-1.amazonaws.com" },
            { code: "us-east-2", name: "US East (Ohio)", endpoint: "https://s3.us-east-2.amazonaws.com" },
            { code: "us-west-1", name: "US West (N. California)", endpoint: "https://s3.us-west-1.amazonaws.com" },
            { code: "us-west-2", name: "US West (Oregon)", endpoint: "https://s3.us-west-2.amazonaws.com" },
            { code: "ca-central-1", name: "Canada (Central)", endpoint: "https://s3.ca-central-1.amazonaws.com" },
            { code: "eu-west-1", name: "Europe (Ireland)", endpoint: "https://s3.eu-west-1.amazonaws.com" },
            { code: "eu-west-2", name: "Europe (London)", endpoint: "https://s3.eu-west-2.amazonaws.com" },
            { code: "eu-west-3", name: "Europe (Paris)", endpoint: "https://s3.eu-west-3.amazonaws.com" },
            { code: "eu-central-1", name: "Europe (Frankfurt)", endpoint: "https://s3.eu-central-1.amazonaws.com" },
            { code: "eu-north-1", name: "Europe (Stockholm)", endpoint: "https://s3.eu-north-1.amazonaws.com" },
            { code: "ap-south-1", name: "Asia Pacific (Mumbai)", endpoint: "https://s3.ap-south-1.amazonaws.com" },
            { code: "ap-northeast-1", name: "Asia Pacific (Tokyo)", endpoint: "https://s3.ap-northeast-1.amazonaws.com" },
            { code: "ap-northeast-2", name: "Asia Pacific (Seoul)", endpoint: "https://s3.ap-northeast-2.amazonaws.com" },
            { code: "ap-northeast-3", name: "Asia Pacific (Osaka)", endpoint: "https://s3.ap-northeast-3.amazonaws.com" },
            { code: "ap-southeast-1", name: "Asia Pacific (Singapore)", endpoint: "https://s3.ap-southeast-1.amazonaws.com" },
            { code: "ap-southeast-2", name: "Asia Pacific (Sydney)", endpoint: "https://s3.ap-southeast-2.amazonaws.com" },
            { code: "sa-east-1", name: "South America (São Paulo)", endpoint: "https://s3.sa-east-1.amazonaws.com" },
            { code: "af-south-1", name: "Africa (Cape Town)", endpoint: "https://s3.af-south-1.amazonaws.com" },
            { code: "me-south-1", name: "Middle East (Bahrain)", endpoint: "https://s3.me-south-1.amazonaws.com" }
        ];

        /**
         * Timezone to Region Mapping
         * Maps the user's IANA timezone to the closest physical AWS region.
         */
        const timezoneMap = {
            'America/New_York': 'us-east-1', 'America/Detroit': 'us-east-1',
            'America/Chicago': 'us-east-2',
            'America/Los_Angeles': 'us-west-1', 'America/Vancouver': 'us-west-2',
            'America/Phoenix': 'us-west-2', 'America/Denver': 'us-west-2',
            'America/Toronto': 'ca-central-1',
            'Europe/London': 'eu-west-2', 'Europe/Dublin': 'eu-west-1',
            'Europe/Paris': 'eu-west-3', 'Europe/Berlin': 'eu-central-1',
            'Europe/Amsterdam': 'eu-central-1', 'Europe/Stockholm': 'eu-north-1',
            'Asia/Tokyo': 'ap-northeast-1',
            'Asia/Seoul': 'ap-northeast-2',
            'Asia/Singapore': 'ap-southeast-1',
            'Asia/Shanghai': 'ap-northeast-1', // Defaulting generally to Tokyo for stability
            'Asia/Kolkata': 'ap-south-1',
            'Australia/Sydney': 'ap-southeast-2',
            'America/Sao_Paulo': 'sa-east-1',
            'Africa/Johannesburg': 'af-south-1'
        };

        let userRegionCode = 'us-east-1'; // Default Fallback

        // 1. Detect Region on Load
        function detectRegion() {
            try {
                const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                document.getElementById('detectedTimezone').textContent = userTimezone;

                // Simple exact match check first
                if (timezoneMap[userTimezone]) {
                    userRegionCode = timezoneMap[userTimezone];
                } else {
                    // Heuristic matching if exact city isn't in our small map
                    if (userTimezone.includes("New_York") || userTimezone.includes("Eastern")) userRegionCode = "us-east-1";
                    else if (userTimezone.includes("Pacific") || userTimezone.includes("Los_Angeles")) userRegionCode = "us-west-2";
                    else if (userTimezone.includes("London") || userTimezone.includes("Dublin")) userRegionCode = "eu-west-2";
                    else if (userTimezone.includes("Europe")) userRegionCode = "eu-central-1";
                    else if (userTimezone.includes("Asia")) userRegionCode = "ap-southeast-1"; // Generic Asia hub
                }
            } catch (e) {
                console.warn("Timezone detection failed, defaulting to us-east-1");
            }

            // Setup the Hero Section
            const regionData = awsRegions.find(r => r.code === userRegionCode) || awsRegions[0];
            document.getElementById('heroName').innerHTML = `${regionData.name} <span class="region-code">${regionData.code}</span>`;
            document.getElementById('heroSection').style.display = 'flex';

            // Populate the full table
            populateTable();

            // Auto-run tests immediately
            runAllTests();
        }

        function populateTable() {
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';

            // Sort: Put user's region at the top
            const sortedRegions = [...awsRegions].sort((a, b) => {
                return (a.code === userRegionCode) ? -1 : (b.code === userRegionCode) ? 1 : 0;
            });

            sortedRegions.forEach(region => {
                const isUserRegion = region.code === userRegionCode;
                const tr = document.createElement('tr');
                tr.id = `row-${region.code}`;
                if (isUserRegion) tr.className = 'highlight-row';

                tr.innerHTML = `
                <td>
                    <strong>${region.name}</strong> <span class="region-code">${region.code}</span>
                    ${isUserRegion ? '<span class="badge" style="background:#232f3e; color:white; margin-left:5px;">YOUR REGION</span>' : ''}
                </td>
                <td><span id="status-${region.code}" class="badge pending">Waiting</span></td>
                <td id="latency-${region.code}" style="font-family:monospace; color:#666;">--</td>
            `;
                tbody.appendChild(tr);
            });
        }

        async function runAllTests() {
            const btn = document.getElementById('runBtn');
            btn.disabled = true;
            btn.textContent = "Testing Connectivity...";

            // Reset UI
            awsRegions.forEach(r => {
                document.getElementById(`status-${r.code}`).className = "badge pending";
                document.getElementById(`status-${r.code}`).textContent = "Waiting";
            });

            // 1. Test User Region FIRST and update Hero Card
            const userRegion = awsRegions.find(r => r.code === userRegionCode);
            if (userRegion) {
                await checkRegion(userRegion, true);
            }

            // 2. Test the rest in parallel
            const promises = awsRegions
                .filter(r => r.code !== userRegionCode)
                .map(r => checkRegion(r, false));

            await Promise.all(promises);

            btn.disabled = false;
            btn.textContent = "Run Again";
        }

        async function checkRegion(region, isHero) {
            const statusId = `status-${region.code}`;
            const latencyId = `latency-${region.code}`;

            const startTime = performance.now();

            try {
                // "no-cors" mode lets us ping the server. 
                // We can't read the response, but if the promise resolves, the network path is open.
                await fetch(region.endpoint + "?t=" + Date.now(), {
                    mode: 'no-cors',
                    method: 'HEAD',
                    cache: 'no-store'
                });

                const duration = (performance.now() - startTime).toFixed(0);

                // Update Table Row
                document.getElementById(statusId).textContent = "Accessible";
                document.getElementById(statusId).className = "badge success";
                document.getElementById(latencyId).textContent = `${duration} ms`;

                // Update Hero if applicable
                if (isHero) {
                    const heroStatus = document.getElementById('heroStatus');
                    heroStatus.className = "hero-status success";
                    document.getElementById('heroStatusText').textContent = "Service Reachable";
                    document.getElementById('heroLatency').textContent = `${duration} ms latency`;
                }

            } catch (e) {
                // Update Table Row
                document.getElementById(statusId).textContent = "Unreachable";
                document.getElementById(statusId).className = "badge error";
                document.getElementById(latencyId).textContent = "TIMEOUT";

                // Update Hero if applicable
                if (isHero) {
                    const heroStatus = document.getElementById('heroStatus');
                    heroStatus.className = "hero-status error";
                    document.getElementById('heroStatusText').textContent = "Connection Failed";
                    document.getElementById('heroLatency').textContent = "Check Firewall/ISP";
                }
            }
        }

        // Initialize on load
        detectRegion();

    </script>

</body>

</html>
