appId: zone.syrian.app
name: Syrian Zone native transit surfaces
---
- runFlow:
    when:
      platform: iOS
    commands:
      - setPermissions:
          permissions:
            location: never
- runFlow:
    when:
      platform: Android
    commands:
      - setPermissions:
          permissions:
            location: deny
- openLink: "syrianzone://transit/city/damascus"
- runFlow: accept-deep-link.yaml
- extendedWaitUntil:
    visible: "عرض الكل على الخريطة"
    timeout: 30000
- openLink: "syrianzone://transit/city/damascus/map"
- runFlow: accept-deep-link.yaml
- extendedWaitUntil:
    visible: "ابحث عن خط أو محطة"
    timeout: 30000
- tapOn: "المحطات القريبة"
- runFlow:
    when:
      platform: Android
      visible:
        id: "com.android.permissioncontroller:id/permission_deny.*button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_deny.*button"
- extendedWaitUntil:
    visible: "يلزم السماح بالموقع لعرض المحطات القريبة."
    timeout: 30000
- openLink: "syrianzone://transit/studio"
- runFlow: accept-deep-link.yaml
- extendedWaitUntil:
    visible: "1. اختر المدينة"
    timeout: 30000
- tapOn:
    id: "transit-studio-city-damascus"
- extendedWaitUntil:
    visible: "2. ارسم المسار"
    timeout: 30000
- openLink: "syrianzone://transit/city/damascus/route/maestro-missing-route"
- runFlow: accept-deep-link.yaml
- extendedWaitUntil:
    visible: "تعذر العثور على الخط."
    timeout: 30000
